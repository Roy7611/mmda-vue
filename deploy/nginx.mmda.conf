# mmda unified frontend + API (production sketch)
#
# Build:
#   pnpm --filter @mmda/app build → packages/app/dist
#
# Copy packages/app/dist to /var/www/mmda/app.

upstream mmda_api {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name mmda.local;

    # One SPA owns both /BASE/* and /MES/* routes.
    location / {
        root /var/www/mmda/app;
        try_files $uri $uri/ /index.html;
    }

    # Unified API gateway (oauth / base / mes)
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://mmda_api/api/;
    }

}
